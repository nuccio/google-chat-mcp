# Moves the `stable` tag: the last version tried in a real client and known to
# work. Run it by hand with "Run workflow" in the Actions tab, after trying
# `latest`. (`latest` itself is moved by the Tests workflow, when the tests on
# main pass.)
# It then deletes the branches of the pull requests released by this
# promotion: they are kept until then, so a change can still be looked at on
# its branch while it is only on `latest`.
# Install either with: uvx "git+https://github.com/nuccio/google-chat-mcp@stable"

name: Release tags

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit to mark as stable (empty = the commit tagged latest)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-tags
  cancel-in-progress: false

jobs:
  stable:
    name: Promote to stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve the commit
        id: target
        env:
          REQUESTED: ${{ inputs.commit }}
        run: |
          git fetch --tags --force origin
          if [ -n "$REQUESTED" ]; then
            ref="$REQUESTED"
          else
            ref="refs/tags/latest"
          fi
          if ! sha=$(git rev-parse -q --verify "$ref^{commit}"); then
            echo "::error::'$ref' does not exist."
            exit 1
          fi
          # stable must be a version that is (or was) on main, never a side branch.
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Tag and push
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a stable "$SHA" -m "stable: $SHA, promoted by ${GITHUB_ACTOR}"
          git push -f origin refs/tags/stable
          echo "stable → $(git log -1 --format='%h %s' "$SHA")" >> "$GITHUB_STEP_SUMMARY"
      - name: Delete released branches
        env:
          SHA: ${{ steps.target.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A branch is deleted when its pull request was merged into main, the
          # merge is now part of stable, nothing was pushed to it after the
          # merge, and no open pull request still uses it.
          deleted=""
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=closed&base=main&per_page=100" \
            --jq '.[] | select(.merged_at != null) | "\(.merge_commit_sha) \(.head.sha) \(.head.repo.full_name) \(.head.ref)"' \
            > merged.txt
          while read -r merge_sha head_sha head_repo branch; do
            [ "$head_repo" = "$GITHUB_REPOSITORY" ] && [ "$branch" != main ] || continue
            git cat-file -e "$merge_sha^{commit}" 2>/dev/null || continue
            git merge-base --is-ancestor "$merge_sha" "$SHA" || continue
            tip=$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)
            [ "$tip" = "$head_sha" ] || continue
            # Open pull requests from the branch, or into it (stacked ones).
            open=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:$branch" --jq length)
            [ "$open" = 0 ] || continue
            open=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&base=$branch" --jq length)
            [ "$open" = 0 ] || continue
            # refs/heads/ so that a tag with the same name is never deleted.
            if git push origin --delete "refs/heads/$branch"; then
              deleted="$deleted $branch"
            else
              echo "::warning::Could not delete $branch."
            fi
          done < merged.txt
          if [ -n "$deleted" ]; then
            echo "Deleted branches:" >> "$GITHUB_STEP_SUMMARY"
            for b in $deleted; do echo "- \`$b\`" >> "$GITHUB_STEP_SUMMARY"; done
          else
            echo "No branches to delete." >> "$GITHUB_STEP_SUMMARY"
          fi
