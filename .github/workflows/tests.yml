# Runs the unit tests on every pull request and on every push to main, and on
# demand from the Actions tab ("Run workflow").
# On main, when the tests pass, it also moves the `latest` tag to the tested
# commit: `latest` is the most recent main whose automated tests passed.
# Integration tests (pytest -m integration) need a real OAuth token and are
# not run here.
#
# Actions are pinned to full commit SHAs (required by the repository's Actions
# settings); the comment next to each one is the version it corresponds to.

name: Tests

on:
  pull_request:
  push:
    branches: [main]
  # Manual run from the Actions tab, e.g. when a run cannot be retried.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest

  # NFR-7 on #29: main may carry partial remote work, never a broken local
  # server. This job installs the package as a local user does, without any
  # extra (no NiceGUI, no remote dependencies), and runs the whole suite:
  # tests/test_local_mode.py starts the server over stdio and checks that
  # local mode does not depend on remote code; tests that need an extra skip.
  local-only:
    name: Local mode without extras (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install as a local user would, plus the test tools only
        run: pip install . pytest anyio pytest-mock hatchling
      - name: Run the tests without the remote extra
        env:
          GCM_LOCAL_ONLY_INSTALL: "1"
        run: pytest

  # Level L1 of docs/remote/06-dev-cycle.md: the tests that need Firestore run
  # against the emulator (marker `emulator`, excluded from the other jobs). The
  # image is pinned to a gcloud version; the job fails, never skips, when the
  # emulator does not come up.
  emulator:
    name: Firestore emulator
    runs-on: ubuntu-latest
    env:
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8686
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Start the Firestore emulator
        run: |
          docker run -d --name firestore-emulator -p 127.0.0.1:8686:8686 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:592.0.0-emulators \
            gcloud emulators firestore start --host-port=0.0.0.0:8686
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8686/ > /dev/null; then exit 0; fi
            sleep 1
          done
          docker logs firestore-emulator
          exit 1
      - name: Run the emulator tests
        run: pytest -m emulator

  latest:
    name: Move latest to main
    needs: [test, local-only, emulator]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: tag-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag and push
        run: |
          git fetch --tags --force origin
          # Runs can finish out of order: never move latest backwards.
          if git rev-parse -q --verify "refs/tags/latest^{commit}" >/dev/null &&
             ! git merge-base --is-ancestor "refs/tags/latest^{commit}" "$GITHUB_SHA"; then
            echo "latest is already on a newer commit, leaving it there."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a latest "$GITHUB_SHA" -m "latest: main at $GITHUB_SHA, tests passed"
          git push -f origin refs/tags/latest
          echo "latest → $(git log -1 --format='%h %s' "$GITHUB_SHA")" >> "$GITHUB_STEP_SUMMARY"
