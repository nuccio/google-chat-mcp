# Builds the image of the remote connector (Dockerfile) and checks that it
# starts with both commands: docs/remote/06-dev-cycle.md ("CI smoke test").
# Nothing is pushed: publishing to Artifact Registry is part of the deploy
# pipeline (docs/remote/06-dev-cycle.md#container-image).

name: Docker image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and start the image with both commands
        run: scripts/docker-smoke.sh
