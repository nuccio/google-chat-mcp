[pytest]
testpaths = tests
pythonpath = .
markers =
    emulator: needs the Firestore emulator (FIRESTORE_EMULATOR_HOST). Run with `pytest -m emulator`.
    integration: calls the real Google Chat API (needs a valid OAuth token). Run with `pytest -m integration`.
    gcp: needs a real GCP project and gcloud (GCM_GCP_PROJECT). Run with `pytest -m gcp`; see tests/README.md.
addopts = -m "not integration and not emulator and not gcp"
