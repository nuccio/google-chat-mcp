[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "google-chat-mcp"
version = "0.1.0"
description = "MCP server per Google Chat con controllo granulare degli spazi permessi"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=0.2.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
]

[project.scripts]
google-chat-mcp = "google_chat_mcp.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "anyio[asyncio]>=4.0",
    "pytest-mock>=3.12",
]
