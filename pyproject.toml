[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "google-chat-mcp"
version = "0.1.0"
description = "MCP server for Google Chat with per-space access control"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.0.9",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "mcp-types>=2.3.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
google-chat-mcp = "google_chat_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["google_chat_mcp"]

[project.optional-dependencies]
# The /settings web UI of the remote connector (docs/remote/), built with NiceGUI.
remote = [
    "nicegui>=3.19.0",
]
dev = [
    "nicegui>=3.19.0",
    # Used directly by tests/test_settings_ui.py; NiceGUI 4 no longer installs it.
    "httpx>=0.27",
    "pytest>=8.0",
    "anyio[asyncio]>=4.0",
    "pytest-mock>=3.12",
    "python-dotenv>=1.0",
    "hatchling>=1.21",
]

[dependency-groups]
audit = [
    "pip-audit>=2.9",
]
