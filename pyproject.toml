[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "google-chat-mcp"
version = "0.1.0"
description = "MCP server for Google Chat with per-space access control"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.0.9",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "mcp-types>=2.3.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
google-chat-mcp = "google_chat_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["google_chat_mcp"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "anyio[asyncio]>=4.0",
    "pytest-mock>=3.12",
    "python-dotenv>=1.0",
    "hatchling>=1.21",
]

[dependency-groups]
audit = [
    "pip-audit>=2.9",
]
