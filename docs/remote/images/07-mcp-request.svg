<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="830" viewBox="0 0 1380 830" role="img" aria-labelledby="t d">
<title id="t">gcm-mcp: one tool call</title>
<desc id="d">Claude calls the MCP service. OAuthProxy checks the token and loads the caller's Google token from the encrypted Firestore store. A middleware records the caller. The tools in the core ask the remote AclProvider, which reads the user's ACL from Firestore, and then the remote ChatSource, which calls the Chat API with the caller's own token.</desc>
<defs>
<style>
text{font-family:'Google Sans',Roboto,Arial,sans-serif}
.h{font-size:15px;font-weight:500;fill:#202124}
.e{font-size:11px;font-weight:500;fill:#1A73E8}
.d{font-size:12px;font-weight:400;fill:#5F6368}
.g{font-size:13px;font-weight:500;fill:#5F6368}
.n{font-size:12px;font-weight:700;fill:#FFFFFF;text-anchor:middle}
.box{fill:#FFFFFF;stroke:#DADCE0;filter:url(#sh)}
.core{fill:#FEF7E0;stroke:#FDE293;filter:url(#sh)}
.ln{fill:none;stroke:#5F6368;stroke-width:1.6}
.dash{stroke-dasharray:6 4}
.bd{fill:#1A73E8}
</style>
<filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#3C4043" flood-opacity="0.18"/></filter>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5F6368"/></marker>
</defs>
<rect width="1380" height="830" fill="#FFFFFF"/>
<text x="24" y="36" style="font-size:20px;font-weight:500;fill:#202124">Remote MCP server (gcm-mcp): one tool call</text>
<text x="24" y="58" class="d" style="font-size:12.5px">Yellow is the core, the same code as local mode. The rest is google_chat_mcp.remote. Numbers group the steps of "One user per request" in the text.</text>

<rect x="20" y="80" width="220" height="710" rx="8" fill="#FFFFFF" stroke="#BDC1C6" stroke-dasharray="6 4"/><text x="36" y="106" class="g">Users</text>
<rect x="260" y="80" width="800" height="710" rx="8" fill="#F8F9FA" stroke="#BDC1C6"/><text x="276" y="106" class="g">Google Cloud project</text>
<rect x="285" y="115" width="365" height="635" rx="8" fill="#E8F0FE" stroke="#AECBFA"/><text x="301" y="141" class="g">gcm-mcp · Cloud Run · scale to zero · stateless</text>
<rect x="1080" y="80" width="280" height="710" rx="8" fill="#FFFFFF" stroke="#BDC1C6" stroke-dasharray="6 4"/><text x="1096" y="106" class="g">Google</text>

<!-- Left lane -->
<rect x="40" y="300" width="180" height="80" rx="6" class="box"/>
<g transform="translate(54,314)"><path d="M4 6h24a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H13l-6 5v-5H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z" fill="none" stroke="#5F6368" stroke-width="2"/><circle cx="10" cy="14.5" r="1.6" fill="#5F6368"/><circle cx="16" cy="14.5" r="1.6" fill="#5F6368"/><circle cx="22" cy="14.5" r="1.6" fill="#5F6368"/></g>
<text x="98" y="330" class="h">Claude</text>
<text x="98" y="350" class="d">remote connector,</text>
<text x="98" y="367" class="d">streamable HTTP /mcp</text>

<text x="40" y="450" class="g">Request path</text>
<text x="40" y="472" class="d">1  token checked, Google token loaded</text>
<text x="40" y="492" class="d">2  caller recorded</text>
<text x="40" y="512" class="d">3  ACL read, policy applied</text>
<text x="40" y="532" class="d">4  Chat API, caller's own token</text>
<rect x="40" y="560" width="14" height="14" rx="2" class="core" style="filter:none"/><text x="62" y="572" class="d">core, shared with local mode</text>
<rect x="40" y="584" width="14" height="14" rx="2" fill="#FFFFFF" stroke="#DADCE0"/><text x="62" y="596" class="d">google_chat_mcp.remote</text>

<!-- Stack inside gcm-mcp -->
<rect x="305" y="150" width="300" height="96" rx="6" class="box"/>
<text x="325" y="176" class="h">OAuthProxy</text>
<text x="325" y="194" class="e">GOOGLE_CHAT_MCP.REMOTE · FASTMCP</text>
<text x="325" y="212" class="d">validates the token, loads the caller's</text>
<text x="325" y="228" class="d">Google token; hd in ALLOWED_DOMAINS</text>

<rect x="305" y="278" width="300" height="74" rx="6" class="box"/>
<text x="325" y="304" class="h">users middleware</text>
<text x="325" y="322" class="e">GOOGLE_CHAT_MCP.REMOTE</text>
<text x="325" y="340" class="d">last_mcp_seen_at, hourly per instance</text>

<rect x="305" y="384" width="300" height="96" rx="6" class="core"/>
<text x="325" y="410" class="h">Tools</text>
<text x="325" y="428" class="e">CORE · SAME CODE AS LOCAL MODE</text>
<text x="325" y="446" class="d">create_server(acl_provider, chat_source)</text>
<text x="325" y="462" class="d">identity: the token's sub, never an argument</text>

<rect x="305" y="512" width="300" height="80" rx="6" class="box"/>
<text x="325" y="538" class="h">AclProvider</text>
<text x="325" y="556" class="e">REMOTE IMPLEMENTATION · READ ONLY</text>
<text x="325" y="574" class="d">stored ACL ∩ policy ∩ named spaces only</text>

<rect x="305" y="624" width="300" height="80" rx="6" class="box"/>
<text x="325" y="650" class="h">ChatSource</text>
<text x="325" y="668" class="e">REMOTE IMPLEMENTATION</text>
<text x="325" y="686" class="d">ChatClient from this request's token</text>

<path class="ln" d="M455 246V278" marker-end="url(#ah)"/>
<path class="ln" d="M455 352V384" marker-end="url(#ah)"/>
<path class="ln" d="M455 480V512" marker-end="url(#ah)"/>
<path class="ln" d="M455 592V624" marker-end="url(#ah)"/>

<!-- Firestore -->
<rect x="730" y="140" width="310" height="240" rx="8" fill="#FFFFFF" stroke="#BDC1C6"/><text x="746" y="165" class="g">Firestore · one database</text>
<rect x="750" y="180" width="270" height="52" rx="6" class="box"/>
<text x="766" y="202" class="h" style="font-size:13px">OAuthProxy token store</text><text x="766" y="220" class="d">encrypted with Fernet · read / write</text>
<rect x="750" y="246" width="270" height="52" rx="6" class="box"/>
<text x="766" y="268" class="h" style="font-size:13px">users/{sub}</text><text x="766" y="286" class="d">last_mcp_seen_at · write only this field</text>
<rect x="750" y="312" width="270" height="52" rx="6" class="box"/>
<text x="766" y="334" class="h" style="font-size:13px">acls/{sub}</text><text x="766" y="352" class="d">written by gcm-settings · read only here</text>

<!-- Secret Manager, Logging, gcm-settings -->
<rect x="730" y="440" width="310" height="100" rx="6" class="box"/>
<text x="750" y="466" class="h">Secret Manager</text>
<text x="750" y="486" class="d">Fernet key · jwt_signing_key</text>
<text x="750" y="502" class="d">Google client secret</text>
<text x="750" y="518" class="d">readable by gcm-mcp's account only</text>
<rect x="730" y="570" width="310" height="70" rx="6" class="box"/>
<text x="750" y="596" class="h">Cloud Logging</text>
<text x="750" y="616" class="d">JSON lines · no tool arguments · sub hashed</text>
<rect x="730" y="670" width="310" height="80" rx="6" fill="#FFFFFF" stroke="#BDC1C6" stroke-dasharray="6 4"/>
<text x="750" y="696" class="h">gcm-settings (see 04)</text>
<text x="750" y="716" class="d">writes acls/{sub}. The link the tools return</text>
<text x="750" y="732" class="d">when the ACL is empty points to it.</text>

<!-- Google lane -->
<rect x="1100" y="140" width="240" height="100" rx="6" class="box"/>
<text x="1120" y="166" class="h">Google OAuth</text>
<text x="1120" y="186" class="d">sign-in and token refresh,</text>
<text x="1120" y="202" class="d">tokeninfo and userinfo (sub, hd)</text>
<rect x="1100" y="620" width="240" height="90" rx="6" class="box"/>
<text x="1120" y="646" class="h">Google Chat API</text>
<text x="1120" y="666" class="d">spaces, messages, members,</text>
<text x="1120" y="682" class="d">as the signed-in user</text>

<!-- Flows -->
<path class="ln" d="M220 340H262V198H305" marker-end="url(#ah)"/>
<path class="ln" d="M605 206H750" marker-start="url(#ah)" marker-end="url(#ah)"/>
<path class="ln dash" d="M605 165H668V128H1090V178H1100" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="700" y="122" class="d" style="font-size:11px">sign-in and refresh only</text>
<path class="ln" d="M605 315H670V272H750" marker-end="url(#ah)"/>
<path class="ln" d="M605 552H715V338H750" marker-end="url(#ah)"/>
<path class="ln" d="M605 664H1100" marker-end="url(#ah)"/>
<text x="760" y="658" class="d" style="font-size:11px">Authorization: the caller's token</text>

<circle cx="262" cy="270" r="10" class="bd"/><text x="262" y="274" class="n">1</text>
<circle cx="677" cy="206" r="10" class="bd"/><text x="677" y="210" class="n">1</text>
<circle cx="670" cy="293" r="10" class="bd"/><text x="670" y="297" class="n">2</text>
<circle cx="715" cy="450" r="10" class="bd"/><text x="715" y="454" class="n">3</text>
<circle cx="690" cy="664" r="10" class="bd"/><text x="690" y="668" class="n">4</text>
</svg>
